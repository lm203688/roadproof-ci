name: release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the .ipa to App Store Connect"
        type: boolean
        default: false

env:
  BUNDLE_ID: ${{ vars.ROADPROOF_BUNDLE_ID }}
  WIDGET_BUNDLE_ID: ${{ vars.ROADPROOF_WIDGET_BUNDLE_ID }}
  TEAM_ID: ${{ vars.ROADPROOF_TEAM_ID }}

jobs:
  archive:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Unit tests (396.11 checklist + record chain)
        run: node --test test/kernel.test.js

      - name: Install signing certificate
        env:
          P12_B64: ${{ secrets.DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          set -x
          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p evpass build.keychain || true
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p evpass build.keychain
          security import "$RUNNER_TEMP/dist.p12" -k build.keychain -P "$P12_PASSWORD" -A -t cert -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k evpass build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profiles
        env:
          MAIN_B64: ${{ secrets.PROFILE_MAIN_B64 }}
          MAIN_UUID: ${{ secrets.PROFILE_MAIN_UUID }}
          WIDGET_B64: ${{ secrets.PROFILE_WIDGET_B64 }}
          WIDGET_UUID: ${{ secrets.PROFILE_WIDGET_UUID }}
        run: |
          set -x
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$MAIN_B64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/$MAIN_UUID.mobileprovision"
          printf '%s' "$WIDGET_B64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/$WIDGET_UUID.mobileprovision"
          ls -l "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_B64" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Prebuild iOS project
        env:
          ROADPROOF_BUNDLE_ID: ${{ vars.ROADPROOF_BUNDLE_ID }}
          ROADPROOF_WIDGET_BUNDLE_ID: ${{ vars.ROADPROOF_WIDGET_BUNDLE_ID }}
          ROADPROOF_TEAM_ID: ${{ vars.ROADPROOF_TEAM_ID }}
          ROADPROOF_PROFILE_MAIN: ${{ secrets.PROFILE_MAIN_NAME }}
          ROADPROOF_PROFILE_WIDGET: ${{ secrets.PROFILE_WIDGET_NAME }}
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Archive
        env:
          PROFILE_NAME: ${{ secrets.PROFILE_MAIN_NAME }}
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/roadproof.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            2>&1 | tail -100

      - name: Export ipa
        env:
          PROFILE_MAIN: ${{ secrets.PROFILE_MAIN_NAME }}
          PROFILE_WIDGET: ${{ secrets.PROFILE_WIDGET_NAME }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_MAIN</string>
              <key>$WIDGET_BUNDLE_ID</key><string>$PROFILE_WIDGET</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/roadproof.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            2>&1 | tail -60
          ls -l "$RUNNER_TEMP/ipa" || true

      - name: Verify ipa contents
        run: |
          set -x
          IPA=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          echo "ipa=$IPA"
          rm -rf "$RUNNER_TEMP/ipa-x" && mkdir -p "$RUNNER_TEMP/ipa-x"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-x"
          APP=$(find "$RUNNER_TEMP/ipa-x/Payload" -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          plutil -p "$APP/Info.plist" | grep -Ei 'CFBundleIdentifier|CFBundleVersion|CFBundleShortVersionString' || true
          ls "$APP/PlugIns" || true
          ls "$APP/Metadata.appintents" || true
          codesign -d --entitlements :- "$APP" 2>/dev/null | head -20 || true

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER }}
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
        run: |
          set -o pipefail
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_B64" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          echo "ipa=$IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER" \
            --verbose 2>&1 | tail -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadproof-release
          path: |
            ${{ runner.temp }}/ipa/**/*.ipa
          if-no-files-found: warn
          retention-days: 7
